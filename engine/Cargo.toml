[package]
name = "remaster"
version = "0.1.0"
edition = "2024"
description = "Remaster engine: shared runtime for remastered old games (first game: Armed and Dangerous)"
publish = false

[[bin]]
name = "and_remaster"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.20.0", features = ["dds"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Dependencies are optimised even in dev builds (Bevy is unusably slow at opt-level 0).
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 16
