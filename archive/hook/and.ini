; and_hook configuration. Deployed next to the game executable by tools/deploy.ps1.
; Enhancements default to off: tests always run the faithful game.

[hooks]
; one key per recovered function: 1 = use recovered code (default), 0 = original, 2 = differential

[startup]
skip_intro=0

[display]
windowed=0
width=0
height=0
all_modes=0
vsync=-1
fps_limit=0
